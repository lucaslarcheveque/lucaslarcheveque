name: Generate snake animation

on:
  schedule:
    # tous les jours à 00h05 UTC
    - cron: "5 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: lucaslarcheveque
          outputs: |
            dist/github-snake.svg?color_snake=%237890b4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%237890b4

      - name: Debug dist contents before slowing down
        run: |
          {
            echo "pwd: $(pwd)"
            echo "--- dist listing ---"
            ls -la dist || echo "dist missing"
            echo "--- sed version ---"
            sed --version | head -1 || true
            echo "--- durations before ---"
            grep -oE '[0-9]+ms' dist/*.svg 2>&1 || echo "no matches / files missing"
          } | tee dist/debug.txt

      - name: Slow down snake animation
        run: |
          find dist -name '*.svg' -exec sed -i -E 's/[0-9]+ms/90000ms/g' {} + 2>&1 | tee -a dist/debug.txt
          {
            echo "--- durations after ---"
            grep -oE '[0-9]+ms' dist/*.svg 2>&1 || echo "no matches after"
          } | tee -a dist/debug.txt

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
